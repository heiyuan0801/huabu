server {
    listen 3000;
    server_name _;
    client_max_body_size 64m;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location /ai-proxy/ {
        proxy_pass https://api1.weilai.chat/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name api1.weilai.chat;
        proxy_set_header Host api1.weilai.chat;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location /media-proxy/generated/ {
        proxy_pass http://157.254.18.147:6001/generated/;
        proxy_http_version 1.1;
        proxy_set_header Host 157.254.18.147:6001;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
    }

    location /image-proxy/images/ {
        proxy_pass https://image.weilai.uk/images/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name image.weilai.uk;
        proxy_set_header Host image.weilai.uk;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
    }
}
